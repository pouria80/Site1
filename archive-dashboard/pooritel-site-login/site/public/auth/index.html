    <script>
      // Apply saved language/direction before first paint (defaults to fa/rtl).
      (function () {
        try {
          var l = localStorage.getItem("pt-lang");

            document.documentElement.lang = "en";

        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
